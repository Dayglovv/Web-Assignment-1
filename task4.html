<section class="page-header">

    <h1>Table & Feedback Form</h1>

    <p>Task 4 — CSS Table and Form</p>

</section>


<h2 id="grades-title">
    Student Grades
</h2>


<div class="table-box">


<table>


<thead>

<tr>

    <th>Name</th>

    <th>Subject</th>

    <th>Grade</th>

</tr>

</thead>


<tbody>


<tr>

    <td>Ali</td>

    <td>HTML</td>

    <td>90</td>

</tr>


<tr class="highlight-row">

    <td>Aruzhan</td>

    <td>CSS</td>

    <td>95</td>

</tr>


<tr>

    <td>Daniyar</td>

    <td>JavaScript</td>

    <td>84</td>

</tr>


<tr>

    <td colspan="2">
        Group Average
    </td>

    <td>
        89.7
    </td>

</tr>


</tbody>


</table>


</div>


<div class="form-box">


<h2>
    Feedback Form
</h2>


<form>


<label for="name">
    Name
</label>

<input
    type="text"
    id="name"
    placeholder="Enter your name"
>


<label for="email">
    Email
</label>

<input
    type="email"
    id="email"
    placeholder="Enter your email"
>


<label for="role">
    Your role
</label>

<select id="role">

    <option>Student</option>

    <option>Teacher</option>

    <option>Other</option>

</select>


<label>
    Do you like this website?
</label>


<input
    type="radio"
    name="answer"
    id="yes"
>

<label for="yes">
    Yes
</label>


<input
    type="radio"
    name="answer"
    id="no"
>

<label for="no">
    No
</label>


<label for="comments">
    Comments
</label>


<textarea
    id="comments"
    placeholder="Write your feedback..."
></textarea>


<button
    type="submit"
    class="submit-btn"
>
    Submit Feedback
</button>


</form>


</div>


<footer class="footer">

</footer>
